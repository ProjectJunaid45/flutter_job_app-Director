name: first_flutter_project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.2
  share_plus: ^10.0.0
  pdf: ^3.10.8
  printing: ^5.13.1
  cupertino_icons: ^1.0.8
  local_auth: ^3.0.2
  supabase_flutter: ^2.17.2
  http: ^1.6.0
  shared_preferences: ^2.5.5
  shorebird_code_push: ^2.0.7
  restart_app: ^1.10.1
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/nextgen_logo_1.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#07121A"
  adaptive_icon_foreground: "assets/images/nextgen_logo_1.jpg"
  adaptive_icon_foreground_inset: 22

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - shorebird.yaml
